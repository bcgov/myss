name: Pull Request Validation

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run API tests
        run: dotnet test Apps/MyssApi.Tests --configuration Release

  mysscontent-tests:
    name: MyssContent tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Apps/MyssContent

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Apps/MyssContent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  webclient-tests:
    name: Web client tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Apps/MyssWebclient

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Apps/MyssWebclient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser-headless
