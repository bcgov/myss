name: Deploy release

# Deploy a release to test or prod by starting the tenant repo's
# p-promote-all pipeline.
#
# test: deploys the draft release kept by the "Release draft" workflow. Its
#   body lists the build each app ships (see .github/scripts/release.sh); edit
#   it on the Releases page first to pin other builds. The deploy tags those
#   images v<version>, promotes them, publishes the draft as a pre-release
#   with the exact list deployed, and starts the next draft. Give a published
#   release instead to redeploy it (a rollback).
# prod: deploys the newest pre-release, or the release given. Its images must
#   be the ones in test. Marks the release as the latest.
#
# Who can deploy: repository admins only, checked in `authorize` and again in
# `deploy` (a re-run of failed jobs skips `authorize`), for both the person
# who started the run and the person who re-ran it.
# Approvals (repository Settings > Environments, all with "Prevent self-review"
# and "Deployment branches" set to dev only, administrators not allowed to
# bypass). The branch rule matters: a manual run uses the workflow file from
# the branch it is started on, so without it anyone with write access could
# run a copy of this file with the checks removed.
#   test           1 required reviewer
#   prod-approval  first prod approval
#   prod           second prod approval; `deploy` also checks the run has two
#                  different approvers, since one person can be a reviewer
#                  on both environments
# Configuration:
#   OPENSHIFT_SERVER  repository variable, the cluster API URL
#   OPENSHIFT_TOKEN   secret on the test and prod environments, the token of
#                     the github-deployer ServiceAccount in e07f31-tools

run-name: Deploy ${{ inputs.release || 'next release' }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - test
          - prod
      release:
        description: >-
          Leave empty for the usual release: the draft for test, the newest
          pre-release for prod. Or a published release (e.g. v0.7.3) to
          redeploy it.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment }}

jobs:
  authorize:
    name: Check request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # read draft releases
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release-id: ${{ steps.resolve.outputs.release-id }}
      draft: ${{ steps.resolve.outputs.draft }}
      commit: ${{ steps.resolve.outputs.commit }}
      images: ${{ steps.check.outputs.images }}
    steps:
      - name: Require repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for user in $(printf '%s\n' "${{ github.actor }}" "${{ github.triggering_actor }}" | sort -u); do
            role=$(gh api "repos/${{ github.repository }}/collaborators/$user/permission" --jq .permission)
            if [ "$role" != "admin" ]; then
              echo "::error::$user has '$role' access; deploying to $TARGET needs admin."
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          repo="${{ github.repository }}"
          if [ -n "$RELEASE" ]; then
            json=$(gh api "repos/$repo/releases/tags/$RELEASE") || {
              echo "::error::No published release $RELEASE."; exit 1; }
          elif [ "$TARGET" = test ]; then
            json=$(gh api "repos/$repo/releases" --paginate --jq '.[] | select(.draft)' | jq -s '.[0] // empty')
            [ -n "$json" ] || { echo "::error::There is no draft release; run the Release draft workflow."; exit 1; }
          else
            json=$(gh api "repos/$repo/releases" --paginate --jq '.[] | select(.draft | not) | select(.prerelease)' | jq -s '.[0] // empty')
            [ -n "$json" ] || { echo "::error::There is no pre-release to deploy to prod."; exit 1; }
          fi
          tag=$(jq -r .tag_name <<<"$json")
          draft=$(jq -r .draft <<<"$json")
          if [ "$draft" = true ]; then
            commit=$(jq -r .target_commitish <<<"$json")
          else
            commit=$(git rev-list -n1 "refs/tags/$tag")
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag $tag is not v<major>.<sprint>.<n>."; exit 1; }
          {
            echo "version=$tag"
            echo "release-id=$(jq -r .id <<<"$json")"
            echo "draft=$draft"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          jq -r .body <<<"$json" > "$RUNNER_TEMP/body.md"
          echo "Deploying $tag ($([ "$draft" = true ] && echo draft || echo published)) at $(git log -1 --format='%h %s' "$commit")"

      - name: Check the images listed in the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          listed=$(.github/scripts/release.sh parse < "$RUNNER_TEMP/body.md")
          images="" bad=0
          {
            echo "### $VERSION to $TARGET"
            echo "| App | Image | Built from |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for app in $(.github/scripts/release.sh apps); do
            value=$(sed -n "s/^$app: //p" <<<"$listed" | head -n1)
            if [ -z "$value" ]; then
              echo "::error::The release does not list $app."; bad=1; continue
            fi
            sha=$(.github/scripts/release.sh resolve "$app" "$value") || { echo "::error::$app: cannot use '$value'."; bad=1; continue; }
            images+="$app=$value "
            eval "sha_${app//-/_}=$sha"
            echo "| $app | \`$value\` | $(git log -1 --format='%h %s' "$sha" | sed 's/|/\\|/g') |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$bad" = 0 ] || exit 1
          # The API applies the database migrations for both APIs, so the two
          # must agree on MyssData.
          if ! git diff --quiet "$sha_myss_api" "$sha_myss_admin_api" -- Apps/MyssData; then
            echo "::error::myss-api ($sha_myss_api) and myss-admin-api ($sha_myss_admin_api) have different Apps/MyssData; pick builds with the same database code."
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # The first of the two prod approvals. Skipped for test.
  prod-approval:
    name: First prod approval
    needs: authorize
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod-approval
    steps:
      - run: echo "First approval for ${{ needs.authorize.outputs.version }} to prod recorded."

  deploy:
    name: Deploy ${{ needs.authorize.outputs.version }} to ${{ inputs.environment }}
    needs: [authorize, prod-approval]
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.prod-approval.result == 'success' ||
       (inputs.environment == 'test' && needs.prod-approval.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # publish the release
      actions: write # read this run's approvals, start the next draft
    env:
      VERSION: ${{ needs.authorize.outputs.version }}
      COMMIT: ${{ needs.authorize.outputs.commit }}
      IMAGES: ${{ needs.authorize.outputs.images }}
      DRAFT: ${{ needs.authorize.outputs.draft }}
    steps:
      - name: Require repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for user in $(printf '%s\n' "${{ github.actor }}" "${{ github.triggering_actor }}" | sort -u); do
            role=$(gh api "repos/${{ github.repository }}/collaborators/$user/permission" --jq .permission)
            if [ "$role" != "admin" ]; then
              echo "::error::$user has '$role' access; deploying to $TARGET needs admin."
              exit 1
            fi
          done

      - name: Require two different prod approvers
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approvers=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | unique | map(select(. != "${{ github.actor }}" and . != "${{ github.triggering_actor }}")) | .[]')
          echo "Approved by: $(echo $approvers)"
          if [ "$(echo "$approvers" | grep -c .)" -lt 2 ]; then
            echo "::error::Prod needs two approvers other than the requester."
            exit 1
          fi

      - name: Install oc
        run: |
          curl -fsSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.18/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc
          oc version --client

      - name: Log in to OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login --server="${{ vars.OPENSHIFT_SERVER }}" --token="$OPENSHIFT_TOKEN" >/dev/null
          # Not `oc project`: that reads the Project, which the deployer's
          # Role does not grant. This only sets the kubeconfig default.
          oc config set-context --current --namespace=e07f31-tools >/dev/null

      - name: Tag the release's images (draft)
        if: env.DRAFT == 'true'
        run: |
          missing=0
          for pair in $IMAGES; do
            oc get istag "${pair%%=*}:${pair#*=}" >/dev/null 2>&1 || {
              echo "::error::${pair%%=*}:${pair#*=} not found (has its build finished?)"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          for pair in $IMAGES; do
            oc tag "${pair%%=*}:${pair#*=}" "${pair%%=*}:$VERSION"
          done

      - name: Check the release's images exist
        if: env.DRAFT != 'true'
        run: |
          missing=0
          for pair in $IMAGES; do
            oc get istag "${pair%%=*}:$VERSION" >/dev/null 2>&1 || { echo "::error::${pair%%=*}:$VERSION not found"; missing=1; }
          done
          exit $missing

      - name: Require prod to match test
        if: inputs.environment == 'prod'
        run: |
          differ=0
          for app in $(for pair in $IMAGES; do echo "${pair%%=*}"; done); do
            want=$(oc get istag "$app:$VERSION" -o jsonpath='{.image.metadata.name}')
            have=$(oc get istag "$app:test" -o jsonpath='{.image.metadata.name}' 2>/dev/null || true)
            [ "$want" = "$have" ] || { echo "::error::$app in test is not $VERSION"; differ=1; }
          done
          exit $differ

      - name: Run p-promote-all
        run: |
          run=$(oc create -o name -f - <<EOF
          apiVersion: tekton.dev/v1beta1
          kind: PipelineRun
          metadata:
            generateName: promote-all-$TARGET-
            labels:
              myss.gov.bc.ca/release: "$VERSION"
            annotations:
              myss.gov.bc.ca/requested-by: "${{ github.actor }}"
              myss.gov.bc.ca/workflow-run: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          spec:
            pipelineRef:
              name: p-promote-all
            serviceAccountName: pipeline
            params:
              - name: imageTagSource
                value: "$VERSION"
              - name: imageTagTarget
                value: "$TARGET"
          EOF
          )
          echo "Started $run"
          while :; do
            status=$(oc get "$run" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
            case "$status" in
              True) echo "$run succeeded"; break ;;
              False)
                oc get "$run" -o jsonpath='{.status.conditions[0].message}{"\n"}'
                oc get taskruns -l "tekton.dev/pipelineRun=${run#*/}" \
                  -o custom-columns=TASK:.metadata.labels.tekton\\.dev/pipelineTask,STATUS:.status.conditions[0].reason,MESSAGE:.status.conditions[0].message
                exit 1 ;;
            esac
            sleep 15
          done

      - name: Publish the pre-release (test)
        if: env.DRAFT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}" id="${{ needs.authorize.outputs.release-id }}"
          # The draft may have been refreshed since the run started; publish
          # it with the list that was deployed.
          deployed=$(for pair in $IMAGES; do echo "${pair%%=*}: ${pair#*=}"; done)
          gh api "repos/$repo/releases/$id" --jq .body | tr -d '\r' |
            DEPLOYED="$deployed" awk '
              /^```release[[:space:]]*$/ { print; print ENVIRON["DEPLOYED"]; skip = 1; next }
              skip && /^```/ { skip = 0 }
              !skip' > "$RUNNER_TEMP/body.md"
          gh api -X PATCH "repos/$repo/releases/$id" \
            -f "tag_name=$VERSION" -f "name=$VERSION" -f "target_commitish=$COMMIT" \
            -F draft=false -F prerelease=true -F "body=@$RUNNER_TEMP/body.md" --jq '"Published " + .html_url'
          gh workflow run release-draft.yml --repo "$repo" --ref dev

      - name: Mark the release as latest (prod)
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --repo "${{ github.repository }}" --prerelease=false --latest

      - name: Summary
        run: |
          {
            echo "### $VERSION deployed to $TARGET"
            echo "- Commit: \`$COMMIT\`"
            echo "- Requested by: ${{ github.actor }}"
            for pair in $IMAGES; do echo "- ${pair%%=*}: \`${pair#*=}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
