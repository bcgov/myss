name: Pull Request Validation

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Security Scan
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: true
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run API tests
        run: dotnet test Apps/MyssApi.Tests --configuration Release

      - name: Run ICM client tests
        run: dotnet test Apps/IcmApi.Tests --configuration Release

  mysscontent-tests:
    name: MyssContent tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Apps/MyssContent

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Apps/MyssContent/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mirrors the image build (Dockerfile `build` stage): vitest transpiles
      # with esbuild and never typechecks, so without this step type errors
      # first surface in the deploy pipeline, after merge.
      - name: Typecheck and build
        run: DATABASE_CLIENT=postgres npx strapi ts:generate-types && npm run build

      - name: Run unit tests
        run: npm test

  webclient-tests:
    name: Web client tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Apps/MyssWebclient

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Apps/MyssWebclient/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b && vite build` — the same command the image build runs.
      # Vitest transpiles with esbuild and never typechecks, so without this
      # step type errors first surface in the deploy pipeline, after merge.
      - name: Typecheck and build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser-headless
